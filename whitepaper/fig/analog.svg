<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 356" width="700" height="356" font-family='system-ui,-apple-system,"Segoe UI",sans-serif'><rect width="700" height="356" fill="#fcfcfb"/><text x="0" y="17" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600">What the analog channel survives</text><text x="0" y="34" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400">bit error rate recovering the kerning fingerprint from an image of the page</text><text x="211" y="64.96" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">clean render, 72-300 dpi</text><line x1="222" y1="54" x2="222" y2="68" stroke="#0ca30c" stroke-width="2.5"/><text x="231" y="64.96" font-size="10.5" fill="#0ca30c" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">0.000</text><text x="274" y="64.96" font-size="10" fill="#898781" text-anchor="start" font-weight="400">fingerprint fully recovered</text><text x="211" y="93.96" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">JPEG q75 and q40</text><line x1="222" y1="83" x2="222" y2="97" stroke="#0ca30c" stroke-width="2.5"/><text x="231" y="93.96" font-size="10.5" fill="#0ca30c" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">0.000</text><text x="274" y="93.96" font-size="10" fill="#898781" text-anchor="start" font-weight="400">fingerprint fully recovered</text><text x="211" y="122.96" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">downscale 50% then restore</text><line x1="222" y1="112" x2="222" y2="126" stroke="#0ca30c" stroke-width="2.5"/><text x="231" y="122.96" font-size="10.5" fill="#0ca30c" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">0.000</text><text x="274" y="122.96" font-size="10" fill="#898781" text-anchor="start" font-weight="400">fingerprint fully recovered</text><text x="211" y="151.96" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">sensor noise, sigma 8</text><line x1="222" y1="141" x2="222" y2="155" stroke="#0ca30c" stroke-width="2.5"/><text x="231" y="151.96" font-size="10.5" fill="#0ca30c" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">0.000</text><text x="274" y="151.96" font-size="10" fill="#898781" text-anchor="start" font-weight="400">fingerprint fully recovered</text><text x="211" y="180.96" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">Gaussian blur, radius 1.5 px</text><line x1="222" y1="170" x2="222" y2="184" stroke="#0ca30c" stroke-width="2.5"/><text x="231" y="180.96" font-size="10.5" fill="#0ca30c" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">0.000</text><text x="274" y="180.96" font-size="10" fill="#898781" text-anchor="start" font-weight="400">fingerprint fully recovered</text><text x="211" y="209.96" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">print-scan simulation</text><line x1="222" y1="199" x2="222" y2="213" stroke="#0ca30c" stroke-width="2.5"/><text x="231" y="209.96" font-size="10.5" fill="#0ca30c" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">0.000</text><text x="274" y="209.96" font-size="10" fill="#898781" text-anchor="start" font-weight="400">fingerprint fully recovered</text><text x="211" y="238.96" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">rotation 5 deg, deskewed</text><line x1="222" y1="228" x2="222" y2="242" stroke="#0ca30c" stroke-width="2.5"/><text x="231" y="238.96" font-size="10.5" fill="#0ca30c" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">0.000</text><text x="274" y="238.96" font-size="10" fill="#898781" text-anchor="start" font-weight="400">fingerprint fully recovered</text><text x="211" y="267.96" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">Gaussian blur, radius 3.0 px</text><rect x="222" y="255" width="9.5" height="18" rx="4" fill="#eb6834"/><text x="239.5454