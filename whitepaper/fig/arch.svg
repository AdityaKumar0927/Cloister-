<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 374" width="700" height="374" font-family='system-ui,-apple-system,"Segoe UI",sans-serif'><rect width="700" height="374" fill="#fcfcfb"/><text x="0" y="18" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Where each layer intervenes</text><text x="0" y="36" font-size="11" fill="#898781" text-anchor="start" font-weight="400">the document's journey, left to right, and what CLOISTER does at each stage</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs><rect x="0" y="56" width="158" height="88" rx="8" fill="#2a78d6" opacity="0.06"/><rect x="0" y="56" width="158" height="88" rx="8" fill="none" stroke="#2a78d6" stroke-width="1.5"/><text x="12" y="76" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="700">1 · AT REST</text><text x="12" y="94" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">Envelope: X25519 +</text><text x="12" y="108" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">ML-KEM-768 hybrid;</text><text x="12" y="122" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">content key bound to a</text><text x="12" y="136" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">posture policy digest</text><rect x="190" y="56" width="158" height="88" rx="8" fill="#2a78d6" opacity="0.06"/><rect x="190" y="56" width="158" height="88" rx="8" fill="none" stroke="#2a78d6" stroke-width="1.5"/><text x="202" y="76" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="700">2 · AT OPEN</text><text x="202" y="94" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">Membrane: keys released</text><text x="202" y="108" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">only into a runtime with</text><text x="202" y="122" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">no egress, no capture,</text><text x="202" y="136" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">no ptrace, no clipboard</text><rect x="380" y="56" width="158" height="88" rx="8" fill="#eb6834" opacity="0.06"/><rect x="380" y="56" width="158" height="88" rx="8" fill="none" stroke="#eb6834" stroke-width="1.5"/><text x="392" y="76" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="700">3 · IF IT LEAVES</text><text x="392" y="94" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">Chaff: text layer is a</text><text x="392" y="108" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">fluent per-recipient</text><text x="392" y="122" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">decoy; only the raster</text><text x="392" y="136" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">carries the truth</text><rect x="552" y="56" width="148" height="88" rx="8" fill="#1baf7a" opacity="0.06"/><rect x="552" y="56" width="148" height="88" rx="8" fill="none" stroke="#1baf7a" stroke-width="1.5"/><text x="564" y="76" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="700">4 · AFTER THE FACT</text><text x="564" y="94" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">Trace: Tardos codeword</text><text x="564" y="108" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">in every copy; probe</text><text x="564" y="122" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">suspect models for the</text><text x="564" y="136" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">canary</text><line x1="166" y1="100" x2="186" y2="100" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/><line x1="356" y1="100" x2="376" y2="100" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/><line x1="542" y1="100" x2="562" y2="100" stroke="#898781" stroke-width="1.5" marker-end="url(#a)"/><text x="0" y="178" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="700">INGESTION PATHS THIS ADDRESSES</text><rect x="0" y="187" width="700" height="19" fill="#0ca30c" opacity="0.05"/><circle cx="7" cy="196" r="3.5" fill="#0ca30c"/><text x="20" y="200" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Drag-and-drop into a consumer chatbot</text><text x="698" y="200" font-size="10.5" fill="#0b0b0b" text-anchor="end" font-weight="400">blocked at 2, degraded at 3</text><rect x="0" y="208" width="700" height="19" fill="#0ca30c" opacity="0.05"/><circle cx="7" cy="217" r="3.5" fill="#0ca30c"/><text x="20" y="221" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Browser AI sidebar reading the open tab</text><text x="698" y="221" font-size="10.5" fill="#0b0b0b" text-anchor="end" font-weight="400">blocked at 2 (no capture, no DOM egress)</text><rect x="0" y="229" width="700" height="19" fill="#0ca30c" opacity="0.05"/><circle cx="7" cy="238" r="3.5" fill="#0ca30c"/><text x="20" y="242" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Agent / MCP server with filesystem access</text><text x="698" y="242" font-size="10.5" fill="#0b0b0b" text-anchor="end" font-weight="400">blocked at 1 — envelope never opens for it</text><rect x="0" y="250" width="700" height="19" fill="#0ca30c" opacity="0.05"/><circle cx="7" cy="259" r="3.5" fill="#0ca30c"/><text x="20" y="263" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Coding assistant indexing a repository</text><text x="698" y="263" font-size="10.5" fill="#0b0b0b" text-anchor="end" font-weight="400">blocked at 1</text><rect x="0" y="271" width="700" height="19" fill="#0ca30c" opacity="0.05"/><circle cx="7" cy="280" r="3.5" fill="#0ca30c"/><text x="20" y="284" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">OS-level assistant screenshotting the screen</text><text x="698" y="284" font-size="10.5" fill="#0b0b0b" text-anchor="end" font-weight="400">blocked at 2 via capture exclusion</text><rect x="0" y="292" width="700" height="19" fill="#0ca30c" opacity="0.05"/><circle cx="7" cy="301" r="3.5" fill="#0ca30c"/><text x="20" y="305" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Enterprise suite auto-indexing the file store</text><text x="698" y="305" font-size="10.5" fill="#0b0b0b" text-anchor="end" font-weight="400">blocked at 1</text><rect x="0" y="313" width="700" height="19" fill="#d03b3b" opacity="0.05"/><circle cx="7" cy="322" r="3.5" fill="#d03b3b"/><text x="20" y="326" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Recipient photographs the screen with a phone</text><text x="698" y="326" font-size="10.5" fill="#d03b3b" text-anchor="end" font-weight="600">not prevented — traced at 4</text><rect x="0" y="334" width="700" height="19" fill="#d03b3b" opacity="0.05"/><circle cx="7" cy="343" r="3.5" fill="#d03b3b"/><text x="20" y="347" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Recipient retypes or dictates the content</text><text x="698" y="347" font-size="10.5" fill="#d03b3b" text-anchor="end" font-weight="600">not prevented — traced at 4 if verbatim</text></svg>