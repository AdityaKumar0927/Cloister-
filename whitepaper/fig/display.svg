<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 456" width="700" height="456" font-family='system-ui,-apple-system,"Segoe UI",sans-serif'><rect width="700" height="456" fill="#fcfcfb"/><text x="0" y="17" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600">What each optical capture path actually recovers</text><text x="0" y="34" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400">true-content recovery from a display running the four-frame cycle at 240 Hz;</text><text x="0" y="48" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400">the reader wears a shutter synchronised to pass half the frames</text><text x="0" y="80" font-size="9.5" fill="#1baf7a" text-anchor="start" font-weight="700">DEFEATED BY THE CONSTRUCTION</text><text x="239" y="110.24" font-size="10.5" fill="#0b0b0b" text-anchor="end" font-weight="600">reader, through the shutter</text><rect x="250" y="98" width="230" height="17" rx="4" fill="#1baf7a"/><text x="488.0" y="110.24" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">1.000</text><text x="528.0" y="110.24" font-size="10" fill="#1baf7a" text-anchor="400" font-weight="400">the page is legible</text><text x="239" y="138.24" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">camera, 1/30 s  (8 display frames)</text><line x1="250" y1="128" x2="250" y2="141" stroke="#1baf7a" stroke-width="2.5"/><text x="259" y="138.24" font-size="10.5" fill="#1baf7a" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">0.000</text><text x="302" y="138.24" font-size="10" fill="#898781" text-anchor="start" font-weight="400">uniform grey</text><text x="239" y="166.24" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">camera, 1/60 s  (4 frames)</text><line x1="250" y1="156" x2="250" y2="169" stroke="#1baf7a" stroke-width="2.5"/><text x="259" y="166.24" font-size="10.5" fill="#1baf7a" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">0.000</text><text x="302" y="166.24" font-size="10" fill="#898781" text-anchor="start" font-weight="400">uniform grey</text><text x="239" y="194.24" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">camera, 1/120 s  (2 frames)</text><line x1="250" y1="184" x2="250" y2="197" stroke="#1baf7a" stroke-width="2.5"/><text x="259" y="194.24" font-size="10.5" fill="#1baf7a" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">0.000</text><text x="302" y="194.24" font-size="10" fill="#898781" text-anchor="start" font-weight="400">uniform grey</text><text x="239" y="222.24" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">exposure straddling two cycles</text><line x1="250" y1="212" x2="250" y2="225" stroke="#1baf7a" stroke-width="2.5"/><text x="259" y="222.24" font-size="10.5" fill="#1baf7a" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">0.000</text><text x="302" y="222.24" font-size="10" fill="#898781" text-anchor="start" font-weight="400">uniform grey</text><text x="239" y="250.24" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">rolling shutter, 20 px bands</text><line x1="250" y1="240" x2="250" y2="253" stroke="#1baf7a" stroke-width="2.5"/><text x="259" y="250.24" font-size="10.5" fill="#1baf7a" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">0.000</text><text x="302" y="250.24" font-size="10" fill="#898781" text-anchor="start" font-weight="400">uniform grey</text><text x="239" y="278.24" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">single frame, off-the-shelf OCR</text><line x1="250" y1="268" x2="250" y2="281" stroke="#1baf7a" stroke-width="2.5"/><text x="259" y="278.24" font-size="10.5" fill="#1baf7a" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">0.000</text><text x="302" y="278.24" font-size="10" fill="#898781" text-anchor="start" font-weight="400">masked</text><text x="239" y="306.24" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">aperture bound, one capture</text><rect x="250" y="294" width="15" height="17" rx="4" fill="#1baf7a"/><text x="273.41" y="306.24" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">0.067</text><text x="313.41" y="306.24" font-size="10" fill="#898781" text-anchor="400" font-weight="400">only the window is there</text><text x="0" y="334" font-size="9.5" fill="#d03b3b" text-anchor="start" font-weight="700">AVAILABLE ONLY TO A CAMERA THAT ISOLATES SINGLE DISPLAY FRAMES</text><text x="239" y="362.24" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">single frame + cell-median unmask</text><rect x="250" y="350" width="230" height="17" rx="4" fill="#d03b3b"/><text x="488.0" y="362.24" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">1.000</text><text x="528.0" y="362.24" font-size="10" fill="#d03b3b" text-anchor="600" font-weight="400">recovered</text><text x="239" y="390.24" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">frame-resolved + pairwise search</text><rect x="250" y="378" width="230" height="17" rx="4" fill="#d03b3b"/><text x="488.0" y="390.24" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">1.000</text><text x="528.0" y="390.24" font-size="10" fill="#d03b3b" text-anchor="600" font-weight="400">recovered in 28 trials</text><line x1="250" y1="94" x2="250" y2="397" stroke="#c3c2b7" stroke-width="1"/><text x="0" y="426" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="600">The full-cycle average is uniform grey to within 5.55e-17 — exactly, pixel by pixel,</text><text x="0" y="440" font-size="10.5" fill="#0b0b0b" text-anchor="start" font-weight="600">because L + (1-L) = 1 everywhere. Such a capture holds no spatial information at all.</text></svg>