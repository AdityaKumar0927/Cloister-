<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family='system-ui,-apple-system,"Segoe UI",sans-serif'><rect width="700" height="470" fill="#fcfcfb"/><text x="0" y="17" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="600">The ingestion oracle does not reach the density that matters</text><text x="0" y="34" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400">canary exposure against how densely one document sits in the training corpus</text><text x="0" y="50" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400">fixed compute (1.5 M gradient examples) · one occurrence · exact rank over 100,000 candidates</text><rect x="76" y="100" width="592" height="89.26666666666668" fill="#1baf7a" opacity="0.06"/><line x1="76" y1="189.26666666666668" x2="668" y2="189.26666666666668" stroke="#1baf7a" stroke-width="1.5" stroke-dasharray="5 3"/><text x="84" y="182.26666666666668" font-size="9.5" fill="#1baf7a" text-anchor="start" font-weight="600">evidential threshold — p < 0.001 needs 10 bits of exposure</text><line x1="76" y1="300.0" x2="668" y2="300.0" stroke="#e1e0d9" stroke-width="1"/><text x="67" y="304.0" font-size="10" fill="#898781" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">0</text><line x1="76" y1="244.44444444444446" x2="668" y2="244.44444444444446" stroke="#e1e0d9" stroke-width="1"/><text x="67" y="248.44444444444446" font-size="10" fill="#898781" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">5</text><line x1="76" y1="188.88888888888889" x2="668" y2="188.88888888888889" stroke="#e1e0d9" stroke-width="1"/><text x="67" y="192.88888888888889" font-size="10" fill="#898781" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">10</text><line x1="76" y1="133.33333333333334" x2="668" y2="133.33333333333334" stroke="#e1e0d9" stroke-width="1"/><text x="67" y="137.33333333333334" font-size="10" fill="#898781" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">15</text><text x="4" y="177.77777777777777" font-size="10" fill="#52514e" text-anchor="start" font-weight="400">exposure</text><text x="4" y="190.77777777777777" font-size="10" fill="#898781" text-anchor="start" font-weight="400">(bits)</text><line x1="116.82758620689654" y1="300" x2="116.82758620689654" y2="304" stroke="#c3c2b7" stroke-width="1"/><text x="116.82758620689654" y="317" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">10⁻⁷</text><line x1="184.8735632183908" y1="300" x2="184.8735632183908" y2="304" stroke="#c3c2b7" stroke-width="1"/><text x="184.8735632183908" y="317" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">10⁻⁶</text><line x1="252.91954022988506" y1="300" x2="252.91954022988506" y2="304" stroke="#c3c2b7" stroke-width="1"/><text x="252.91954022988506" y="317" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">10⁻⁵</text><line x1="320.9655172413793" y1="300" x2="320.9655172413793" y2="304" stroke="#c3c2b7" stroke-width="1"/><text x="320.9655172413793" y="317" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">10⁻⁴</text><line x1="389.01149425287355" y1="300" x2="389.01149425287355" y2="304" stroke="#c3c2b7" stroke-width="1"/><text x="389.01149425287355" y="317" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">10⁻³</text><line x1="457.05747126436785" y1="300" x2="457.05747126436785" y2="304" stroke="#c3c2b7" stroke-width="1"/><text x="457.05747126436785" y="317" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">10⁻²</text><line x1="525.1034482758621" y1="300" x2="525.1034482758621" y2="304" stroke="#c3c2b7" stroke-width="1"/><text x="525.1034482758621" y="317" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">10⁻¹</text><line x1="593.1494252873564" y1="300" x2="593.1494252873564" y2="304" stroke="#c3c2b7" stroke-width="1"/><text x="593.1494252873564" y="317" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">1</text><line x1="661.1954022988506" y1="300" x2="661.1954022988506" y2="304" stroke="#c3c2b7" stroke-width="1"/><text x="661.1954022988506" y="317" font-size="10" fill="#898781" text-anchor="middle" font-weight="400">10</text><text x="372.0" y="337" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">occurrences per million characters of training corpus</text><line x1="76" y1="300" x2="668" y2="300" stroke="#c3c2b7" stroke-width="1"/><polyline fill="none" stroke="#2a78d6" stroke-width="2" points="546.7,235.9 567.3,195.8 587.7,232.3 608.2,115.4 628.7,115.4 649.2,115.4"/><circle cx="546.7" cy="235.9" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="567.3" cy="195.8" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="587.7" cy="232.3" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="608.2" cy="115.4" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="628.7" cy="115.4" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="649.2" cy="115.4" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="662" y="86" font-size="10" fill="#1baf7a" text-anchor="end" font-weight="600">fully memorised — rank 1 of 100,000</text><text x="567.5130551627078" y="257.8888888888889" font-size="10" fill="#eb6834" text-anchor="middle" font-weight="600">collapses into the noise band</text><line x1="116.82758620689654" y1="92" x2="116.82758620689654" y2="300" stroke="#d03b3b" stroke-width="2"/><text x="124.82758620689654" y="114" font-size="10" fill="#d03b3b" text-anchor="start" font-weight="700">one 5 KB document in a 10 TB corpus</text><text x="124.82758620689654" y="129" font-size="9.5" fill="#898781" text-anchor="start" font-weight="400">seven orders of magnitude to the left of</text><text x="124.82758620689654" y="142" font-size="9.5" fill="#898781" text-anchor="start" font-weight="400">anything that can be measured</text><line x1="0" y1="342" x2="700" y2="342" stroke="#e1e0d9" stroke-width="1"/><text x="0" y="358" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600">Does more model capacity rescue it? At a fixed density of 0.42 occurrences per million:</text><text x="0" y="386" font-size="10" fill="#52514e" text-anchor="start" font-weight="400" font-variant-numeric="tabular-nums">  119k parameters</text><rect x="118" y="374" width="161" height="13" rx="3" fill="#eb6834"/><text x="282.5292250884619" y="386" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">7.6 bits</text><text x="0" y="410" font-size="10" fill="#52514e" text-anchor="start" font-weight="400" font-variant-numeric="tabular-nums">  236k parameters</text><rect x="118" y="398" width="189" height="13" rx="3" fill="#eb6834"/><text x="310.6745416853789" y="410" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">8.9 bits</text><text x="0" y="434" font-size="10" fill="#52514e" text-anchor="start" font-weight="400" font-variant-numeric="tabular-nums">  471k parameters</text><rect x="118" y="422" width="228" height="13" rx="3" fill="#1baf7a"/><text x="350.04825055022775" y="434" font-size="10" fill="#0b0b0b" text-anchor="start" font-weight="700" font-variant-numeric="tabular-nums">10.8 bits</text><text x="418.04825055022775" y="434" font-size="9.5" fill="#898781" text-anchor="start" font-weight="400">crosses the threshold, just</text><text x="0" y="462" font-size="10" fill="#52514e" text-anchor="start" font-weight="600">Quadrupling the parameters buys about three bits. Closing seven orders of magnitude that way is not a plan.</text></svg>